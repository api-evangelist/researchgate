name: ResearchGate
description: 'ResearchGate is a professional network and social platform for scientists and researchers,
  founded in 2008 in Berlin, Germany. Members use it to share and discover research publications, connect
  and collaborate with colleagues, ask and answer questions, and track the reach and citations of their
  work. The platform hosts tens of millions of researcher profiles and a large corpus of full-text papers,
  and is operated by ResearchGate GmbH. It exposes no publicly documented developer API surface; this
  profile was surfaced via the dragoneer portfolio and enriched by the API Evangelist pipeline.'
